name: speedometer
description: A private, offline GPS speedometer for Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Flutter framework controls reference this icon font during release bundling.
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.2
  geolocator: ^14.1.1
  go_router: ^16.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  # Keep runtime aligned with drift_dev: schema tooling requires this patch pair.
  drift: 2.34.0
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  webview_flutter: ^4.14.1
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/maps/ne_110m_land.geojson
